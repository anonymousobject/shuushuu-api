# Mediawiki vhost for wiki.e-shuushuu.net.
#
# Auto-included via nginx.conf's `include /etc/nginx/conf.d/*.conf;`.
# Hostname is hardcoded because the wiki only runs in production and
# its public URL is fixed; no templating needed.

# Distributed scraper, 2026-09-13: tens of thousands of IPs, one request
# each, crawling every link on Special:RecentChanges — the from=/days=/hide*
# permutations, the RecentChangesLinked variants, the Atom feed, and the
# UserLogin?returnto= link on each of those pages. None of it is cacheable,
# and every hit costs a PHP worker plus a MariaDB connection; at ~40k
# requests/min MariaDB hits max_connections and MediaWiki answers 500 for
# everyone, humans included. Refuse those shapes at the edge unless the
# request carries a MediaWiki session — logged-in users keep everything.
map "$cookie_shuushuuwiki_session$cookie_shuushuuwikiUserID" $wiki_anon {
    ""      1;
    default 0;
}
# from= is also how Special:AllPages and Special:PrefixIndex page, so it
# only counts on RecentChanges(Linked). The title arrives as ?title= or
# in the path (/index.php/Special:RecentChanges); match either, any case.
map "$arg_title $uri" $wiki_rc_page {
    ~*recentchanges 1;
    default         0;
}
map "$wiki_rc_page:$arg_from" $wiki_rc_from {
    "~^1:." 1;
    default 0;
}
map "$wiki_rc_from:$arg_returntoquery" $wiki_rc_permutation {
    "0:"    0;
    default 1;
}
map $arg_action $wiki_rc_feed {
    feedrecentchanges 1;
    default           0;
}
map "$wiki_anon:$wiki_rc_permutation$wiki_rc_feed" $wiki_refuse {
    default 0;
    "1:10"  1;
    "1:01"  1;
    "1:11"  1;
}

server {
    listen 80;
    listen [::]:80;
    server_name wiki.e-shuushuu.net;
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wiki.e-shuushuu.net;

    ssl_certificate     /etc/letsencrypt/live/wiki.e-shuushuu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.e-shuushuu.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Mediawiki uploads + file embeds can be sizeable. Bump generously.
    client_max_body_size 64M;

    location / {
        if ($wiki_refuse) { return 403; }
        # Resolve at request time (resolver in nginx.conf) so nginx still
        # starts and reloads while the mediawiki container is down. No URI
        # part: with a variable, `http://$wiki_upstream/` would send every
        # request to the wiki's front page.
        set $wiki_upstream mediawiki;
        proxy_pass http://$wiki_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
    }
}

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Supersede in-flight runs when a newer commit lands on the same ref. Without
# this a quick follow-up push left the first run going to completion alongside
# the second, verifying a commit nobody was waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff - Lint
        run: uv run ruff check

      - name: Ruff - Format check
        run: uv run ruff format --check

      - name: mypy - Type check
        run: uv run mypy app/

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shuushuu
          POSTGRES_PASSWORD: shuushuu_ci_password
          POSTGRES_DB: shuushuu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shuushuu -d shuushuu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --tmpfs /var/lib/postgresql:rw

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-for-production-use-min-32-chars
          # Same URL for app-level and test engines so nothing reaching
          # AsyncSessionLocal picks the wrong backend.
          DATABASE_URL: postgresql+asyncpg://shuushuu:shuushuu_ci_password@127.0.0.1:5432/shuushuu_test
          TEST_DATABASE_URL: postgresql+asyncpg://shuushuu:shuushuu_ci_password@127.0.0.1:5432/shuushuu_test
          ENVIRONMENT: development
          DEBUG: "True"
          REDIS_URL: redis://localhost:6379/0
        # --schema-sync runs the schema-sync test (models vs the alembic chain).
        run: |
          uv run pytest tests/ -v --tb=short --maxfail=5 --schema-sync -n auto --dist loadgroup

  # Optional: Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: pip-audit - Check for known vulnerabilities
        run: uv run pip-audit

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

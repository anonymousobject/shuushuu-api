name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Supersede in-flight runs when a newer commit lands on the same ref. Without
# this a quick follow-up push left the first run going to completion alongside
# the second, verifying a commit nobody was waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff - Lint
        run: uv run ruff check

      - name: Ruff - Format check
        run: uv run ruff format --check

      - name: mypy - Type check
        run: uv run mypy app/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.14']

    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: shuushuu_test
          MARIADB_USER: shuushuu
          MARIADB_PASSWORD: shuushuu_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --tmpfs /var/lib/mysql:rw

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if docker exec $(docker ps -q --filter ancestor=mariadb:11.8) mariadb-admin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Wait for Redis to be ready
        run: |
          for i in {1..30}; do
            if docker exec $(docker ps -q --filter ancestor=redis:7-alpine) redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 1
          done

      - name: Run tests
        env:
          # Required application settings
          SECRET_KEY: test-secret-key-for-ci-only-not-for-production-use-min-32-chars
          DATABASE_URL: mysql+aiomysql://shuushuu:shuushuu_ci_password@127.0.0.1:3306/shuushuu_test?charset=utf8mb4
          DATABASE_URL_SYNC: mysql+pymysql://shuushuu:shuushuu_ci_password@127.0.0.1:3306/shuushuu_test?charset=utf8mb4
          # Test database URLs (used by conftest.py)
          TEST_DATABASE_URL: mysql+aiomysql://shuushuu:shuushuu_ci_password@127.0.0.1:3306/shuushuu_test?charset=utf8mb4
          TEST_DATABASE_URL_SYNC: mysql+pymysql://shuushuu:shuushuu_ci_password@127.0.0.1:3306/shuushuu_test?charset=utf8mb4
          # Test database credentials (conftest.py auto-creates user and grants permissions)
          MARIADB_ROOT_PASSWORD: root_password
          TEST_DB_USER: shuushuu
          TEST_DB_PASSWORD: shuushuu_ci_password
          # Optional settings with defaults
          ENVIRONMENT: development
          DEBUG: "True"
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/ -v --tb=short --maxfail=5 --schema-sync -n auto --dist loadgroup

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            htmlcov/
          retention-days: 7

  test-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shuushuu
          POSTGRES_PASSWORD: shuushuu_ci_password
          POSTGRES_DB: shuushuu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shuushuu -d shuushuu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --tmpfs /var/lib/postgresql/data:rw

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-for-production-use-min-32-chars
          # Same URL for app-level and test engines so nothing reaching
          # AsyncSessionLocal picks the wrong backend (mirrors the MariaDB job).
          DATABASE_URL: postgresql+asyncpg://shuushuu:shuushuu_ci_password@127.0.0.1:5432/shuushuu_test
          TEST_DATABASE_URL: postgresql+asyncpg://shuushuu:shuushuu_ci_password@127.0.0.1:5432/shuushuu_test
          ENVIRONMENT: development
          DEBUG: "True"
          REDIS_URL: redis://localhost:6379/0
        # --schema-sync runs the PG schema-sync test (models vs alembic_pg
        # chain); the MariaDB schema-sync suite is mariadb_only and skips here.
        run: |
          uv run pytest tests/ -v --tb=short --maxfail=5 --schema-sync -n auto --dist loadgroup

  # Optional: Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: pip-audit - Check for known vulnerabilities
        run: uv run pip-audit

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
